<div class="news-wrapper">
  <div class="header">
    <h1>Daily Briefing</h1>
    <div class="status">
      <label>{{news.lastUpdated | date: 'dd/MM/yyyy HH:mm:ss' }}</label>
      <button type="button" (click)="getBriefing()">Refresh</button>
    </div>
  </div>
  <div class="news-feed">
    <app-news-section [newsBlock]="news.entries" ></app-news-section>
  </div>
</div>
