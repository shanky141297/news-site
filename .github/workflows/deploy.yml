# Builds the Angular app and deploys it to GitHub Pages on every push to main.
# Repo setting needed once: Settings → Pages → Source → "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# Minimum permissions: read the code, publish to Pages, and prove identity to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels an older run still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      dist: ${{ steps.dist.outputs.path }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # The base href must match the repo name, with both slashes,
        # or the page loads blank with 404s for its JS files.
        run: npx ng build --base-href /news-site/

      - name: Find the build output folder
        id: dist
        # Reads outputPath from angular.json, so this works whatever the project is called.
        # Current Angular puts the site in <outputPath>/browser; older versions use <outputPath>.
        run: |
          DIST=$(node -e "
            const a = require('./angular.json');
            const p = Object.values(a.projects)[0];
            const o = p.architect.build.options.outputPath;
            const base = typeof o === 'string' ? o : (o.base + (o.browser ? '/' + o.browser : ''));
            const fs = require('fs');
            console.log(fs.existsSync(base + '/browser') ? base + '/browser' : base);
          ")
          echo "Build output: $DIST"
          ls "$DIST"
          echo "path=$DIST" >> "$GITHUB_OUTPUT"

      - name: Add a 404 fallback for deep links
        # GitHub Pages has no SPA fallback; serving index.html as 404.html lets Angular handle the route.
        run: cp "${{ steps.dist.outputs.path }}/index.html" "${{ steps.dist.outputs.path }}/404.html"

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.dist.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
